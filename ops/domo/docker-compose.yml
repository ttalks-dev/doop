# Doop on domo: the fork's image (non-root) + Postgres 16, bound to localhost only;
# Tailscale serve terminates HTTPS in front of 127.0.0.1:4400.
# Started by ops/domo/run.sh, which renders ~/doop/.env from Infisical first.
services:
  doop:
    build:
      context: ../..
    image: ttalks/doop:local
    ports:
      - '127.0.0.1:4400:4400'
    env_file:
      - /home/jim_ai/doop/.env
    environment:
      DATABASE_URL: postgres://doop:${POSTGRES_PASSWORD}@db:5432/doop
      NODE_ENV: production
      PORT: '4400'
    volumes:
      - /home/jim_ai/doop/data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: '20m', max-file: '5' }

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: doop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: doop
    volumes:
      - /home/jim_ai/doop/pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U doop']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
